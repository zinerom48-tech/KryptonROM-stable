name: KryptonROM Engine

on:
  workflow_dispatch:
    inputs:
      ROM_NAME:
        description: "Choose ROM Name"
        required: true
        type: choice
        options:
          - ZineROM
          - KryptonROM
          - HiroROM
        default: "ZineROM"

      ROM_VERSION:
        description: "ROM Version (Fixed to 1.2.7)"
        required: true
        type: string
        default: "1.2.7"

      STOCK_DEVICE:
        description: "Your stock device model (e.g. A52s5G, SM-X216B, or type any new device)"
        required: true
        type: string
        default: "SM-X216B"

      USE_UI_8_TETHERING_APEX:
        description: "Set True if your kernel BPF version is 5.4 (lower than 5.10)"
        required: true
        type: boolean
        default: true

      TARGET_DEVICE:
        description: "Target device model (Base) (e.g. SM-G990B, SM-A528B, or type any new device)"
        required: true
        type: string
        default: "SM-X216B"

      TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK:
        description: "Input target device CSC code or direct SamFW download link"
        required: true
        default: ""

      TARGET_FW_VERSION:
        description: "Specific Samsung firmware version (Optional)"
        required: false

      BUILD_DSU_SINGLE_IMG:
        description: "Build Single System Image for DSU Sideloader"
        required: true
        type: boolean
        default: false

      OUTPUT_FILESYSTEM:
        description: "Output filesystem type"
        required: true
        type: choice
        options:
          - erofs
          - ext4
          - f2fs
        default: "erofs"

      COMPRESS_IMG_TO_XZ:
        description: "Compress images to .xz format"
        required: true
        type: boolean
        default: false

      DEBLOAT_ROM:
        description: "Debloat downloaded ROM"
        required: true
        type: boolean
        default: true

      ADD_CHINA_SMART_MANAGER:
        description: "Add China Smart Manager"
        required: true
        type: boolean
        default: true

      ADD_SAMSUNG_FLAGSHIP_APPS:
        description: "Add Samsung Flagship Apps"
        required: true
        type: boolean
        default: true

      ADD_CUSTOM_FEATURES:
        description: "Add Samsung Custom Features"
        required: true
        type: boolean
        default: true

      PATCH_FLAG_SECURE:
        description: "Bypass screenshot and screen record detection"
        required: true
        type: boolean
        default: true

      PATCH_SECURE_FOLDER:
        description: "Patch Samsung Secure Folder"
        required: true
        type: boolean
        default: true

      PATCH_BLUETOOTH_LIBRARY:
        description: "Patch Bluetooth library"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Start ${{ inputs.ROM_NAME }} Engine
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          echo "FIRM_DIR=$(pwd)/FW" \vert{} tee -a "$GITHUB_ENV"
          echo "OUT_DIR=$(pwd)/OUT" \vert{} tee -a "$GITHUB_ENV"
          echo "WORK_DIR=$(pwd)/WORK" \vert{} tee -a "$GITHUB_ENV"
          echo "DEVICES_DIR=$(pwd)/QuantumROM/Devices" \vert{} tee -a "$GITHUB_ENV"
          echo "APKTOOL=$(pwd)/bin/java/apktool.jar" \vert{} tee -a "$GITHUB_ENV"
          echo "VNDKS_COLLECTION=$(pwd)/QuantumROM/vndks" \vert{} tee -a "$GITHUB_ENV"

          echo "ROM_NAME=${{ inputs.ROM_NAME }}" \vert{} tee -a "$GITHUB_ENV"
          echo "ROM_VERSION=${{ inputs.ROM_VERSION }}" \vert{} tee -a "$GITHUB_ENV"
          echo "STOCK_DEVICE=${{ inputs.STOCK_DEVICE }}" \vert{} tee -a "$GITHUB_ENV"
          echo "TARGET_DEVICE=${{ inputs.TARGET_DEVICE }}" \vert{} tee -a "$GITHUB_ENV"
          echo "TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK=${{ inputs.TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK }}" \vert{} tee -a "$GITHUB_ENV"
          echo "TARGET_FW_VERSION=${{ inputs.TARGET_FW_VERSION }}" \vert{} tee -a "$GITHUB_ENV"

          echo "BUILD_DSU_SINGLE_IMG=${{ inputs.BUILD_DSU_SINGLE_IMG }}" \vert{} tee -a "$GITHUB_ENV"
          echo "DEBLOAT_ROM=${{ inputs.DEBLOAT_ROM }}" \vert{} tee -a "$GITHUB_ENV"
          echo "USE_UI_8_TETHERING_APEX=${{ inputs.USE_UI_8_TETHERING_APEX }}" \vert{} tee -a "$GITHUB_ENV"
          echo "ADD_CHINA_SMART_MANAGER=${{ inputs.ADD_CHINA_SMART_MANAGER }}" \vert{} tee -a "$GITHUB_ENV"
          echo "ADD_SAMSUNG_FLAGSHIP_APPS=${{ inputs.ADD_SAMSUNG_FLAGSHIP_APPS }}" \vert{} tee -a "$GITHUB_ENV"
          echo "ADD_CUSTOM_FEATURES=${{ inputs.ADD_CUSTOM_FEATURES }}" \vert{} tee -a "$GITHUB_ENV"
          echo "PATCH_FLAG_SECURE=${{ inputs.PATCH_FLAG_SECURE }}" \vert{} tee -a "$GITHUB_ENV"
          echo "PATCH_SECURE_FOLDER=${{ inputs.PATCH_SECURE_FOLDER }}" \vert{} tee -a "$GITHUB_ENV"
          echo "PATCH_BLUETOOTH_LIBRARY=${{ inputs.PATCH_BLUETOOTH_LIBRARY }}" \vert{} tee -a "$GITHUB_ENV"

          echo "OUTPUT_FILESYSTEM=${{ inputs.OUTPUT_FILESYSTEM }}" \vert{} tee -a "$GITHUB_ENV"
          echo "COMPRESS_IMG_TO_XZ=${{ inputs.COMPRESS_IMG_TO_XZ }}" \vert{} tee -a "$GITHUB_ENV"

      - name: Validate STOCK_DEVICE - ${{ inputs.STOCK_DEVICE }}
        run: |
          REPO="SN-Abdullah-Al-Noman/QuantumROM"
          BRANCH="Devices"
          LOCAL_DEV_DIR="$(pwd)/QuantumROM/Devices/$STOCK_DEVICE"

          source "$(pwd)/scripts/git_utils.sh"

          if [ "$STOCK_DEVICE" != "None" ]; then
              if [ -d "$LOCAL_DEV_DIR" ] && [ -f "$LOCAL_DEV_DIR/config" ]; then
                  echo "✅ Found device '$STOCK_DEVICE' in local repository!"
              else
                  echo "⚠️ Device '$STOCK_DEVICE' not found locally (or missing config). Checking remote source repository ($REPO)..."
                  
                  if ! curl -fsSL -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$REPO/contents/$STOCK_DEVICE?ref=$BRANCH" >/dev/null; then

                    echo "❌ Unsupported: Device '$STOCK_DEVICE' not found in local repo nor in $REPO/$BRANCH"
                    exit 1
                  fi

                  echo "✅ Device supported in remote repository: $STOCK_DEVICE. Downloading..."
                  GIT_SPARSE_DOWNLOAD "$REPO" "$BRANCH" "$STOCK_DEVICE" "$LOCAL_DEV_DIR"
              fi
          else
              echo "ℹ️ STOCK_DEVICE is set to None."
          fi

      - name: Check disk space
        id: disk
        run: |
          FREE_GB=$(df -BG "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free space: ${FREE_GB} GB"
          echo "enough=$([ "$FREE_GB" -ge 50 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Remove unnecessary files
        if: steps.disk.outputs.enough == 'false'
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils \
              f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-21-jdk jq perl xxd kmod erofs-utils curl wget
          sudo modprobe f2fs || true
          git clone https://github.com/SN-Abdullah-Al-Noman/GoFileDownloader.git
          cd GoFileDownloader
          pip install -r requirements.txt
          mkdir -p FW WORK OUT

      - name: Setup Loop Devices
        run: |
          sudo modprobe loop || true
          for i in {0..15}; do
            sudo mknod -m 0660 /dev/loop$i b 7$i 2>/dev/null || true
          done

      - name: Download firmware ▶️ ${{ inputs.TARGET_DEVICE }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          DOWNLOAD_FIRMWARE "$TARGET_DEVICE" "$TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK" "$FIRM_DIR" "$TARGET_FW_VERSION"

      - name: Extract firmware
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          EXTRACT_FIRMWARE "$FIRM_DIR/$TARGET_DEVICE"

      - name: Extract super.img
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          EXTRACT_SUPER_IMG "$FIRM_DIR/$TARGET_DEVICE"

      - name: Extract firmware img
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          EXTRACT_FIRMWARE_IMG "$FIRM_DIR/$TARGET_DEVICE" "all"

      - name: Decode odm, omc
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          DECODE_OMC "$FIRM_DIR/$TARGET_DEVICE" "$OUT_DIR"

      - name: Debloat Rom - ${{ inputs.DEBLOAT_ROM }}
        run: |
          source "$(pwd)/scripts/debloat.sh"
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$DEBLOAT_ROM" = "true" ] \vert{}\vert{} [ "$DEBLOAT_ROM" = "True" ]; then
              DEBLOAT "$FIRM_DIR/$TARGET_DEVICE"
          fi

      - name: Apply stock device configuration
        run: |
          source "$(pwd)/scripts/debloat.sh"
          source "$(pwd)/scripts/QuantumRom
