name: Copy A52s5G Device Tree

on:
  workflow_dispatch:

jobs:
  copy-device-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Old Repo and Copy Folder
        run: |
          git clone --depth 1 -b sixteen https://github.com/Fred0X1/ZineROM-Engine-EOL.git temp_zine
          mkdir -p QuantumROM/Devices/A52s5G
          cp -r temp_zine/QuantumROM/Devices/A52s5G/* QuantumROM/Devices/A52s5G/
          rm -rf temp_zine

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add QuantumROM/Devices/A52s5G
          git commit -m "Copy A52s5G device tree directly from server" || exit 0
          git push
