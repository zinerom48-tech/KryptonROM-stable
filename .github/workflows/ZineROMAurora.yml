name: KryptonROM Engine
run-name: ${{ inputs.ROM_NAME }} V${{ inputs.ROM_VERSION }} for ${{ inputs.STOCK_DEVICE }}

on:
  workflow_dispatch:
    inputs:
      ROM_NAME:
        description: "Choose ROM Name"
        required: true
        type: choice
        options:
          - ZineROM
          - KryptonROM
          - HiroROM
        default: "ZineROM"

      ROM_VERSION:
        description: "ROM version used in the on-device build ID, ZIP filename, and release"
        required: true
        type: string
        default: "3.2.4"

      STOCK_DEVICE:
        description: "Select a QuantumROM stock-device profile (A52s5G and SM-X216B are kept from this repo)."
        required: true
        type: choice
        options:
          - SM-A055F
          - SM-A057F
          - SM-A065F
          - SM-A066B
          - SM-A127F
          - SM-A135F
          - SM-A135F_8.5
          - SM-A137F
          - SM-A146M
          - SM-A155F
          - SM-A156E
          - SM-A165F
          - SM-A175F
          - SM-A176B
          - SM-A225F
          - SM-A225M
          - SM-A226B
          - SM-A235F
          - SM-A236E
          - SM-A245F
          - SM-A256E
          - SM-A266B
          - SM-A315F
          - SM-A325F
          - SM-A336E
          - SM-A346E
          - SM-A356E
          - SM-A366B
          - SM-A415F
          - SM-A426B
          - SM-A515F
          - SM-A525F
          - SM-A536B
          - SM-A546E
          - SM-A556E
          - SM-A715F
          - SM-A725F
          - SM-A736B
          - SM-E225F
          - SM-E346B
          - SM-G780F
          - SM-G780G
          - SM-G781B
          - SM-G990E
          - SM-M136B
          - SM-M146B
          - SM-M156B
          - SM-M166P
          - SM-M176B
          - SM-M215G
          - SM-M225F
          - SM-M325F
          - SM-M346B
          - SM-M356B
          - SM-M366B
          - SM-M556B
          - SM-M558B
          - SM-M566B
          - SM-P613
          - SM-S901B
          - SM-S901E
          - SM-S911B
          - None
          - A52s5G
          - SM-X216B
        default: "A52s5G"

      USE_UI_8_TETHERING_APEX:
        description: "Set True if your kernel BPF version is 5.4 (lower than 5.10)"
        required: true
        type: boolean
        default: true

      TARGET_DEVICE:
        description: "Target device model (Base) (e.g. SM-G990B, SM-A528B, or type any new device)"
        required: true
        type: string
        default: "SM-S711B"

      TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK:
        description: "Input target device CSC code or direct SamFW download link"
        required: true
        default: ""

      TARGET_FW_VERSION:
        description: "Specific Samsung firmware version (Optional)"
        required: false

      BUILD_DSU_SINGLE_IMG:
        description: "Build Single System Image for DSU Sideloader"
        required: true
        type: boolean
        default: false

      OUTPUT_FILESYSTEM:
        description: "Output filesystem type"
        required: true
        type: choice
        options:
          - erofs
          - ext4
          - f2fs
        default: "erofs"

      COMPRESS_IMG_TO_XZ:
        description: "Compress images to .xz format"
        required: true
        type: boolean
        default: false

      DEBLOAT_ROM:
        description: "Debloat downloaded ROM"
        required: true
        type: boolean
        default: true

      ADD_CHINA_SMART_MANAGER:
        description: "Add China Smart Manager"
        required: true
        type: boolean
        default: true

      ADD_SAMSUNG_FLAGSHIP_APPS:
        description: "Add Samsung Flagship Apps"
        required: true
        type: boolean
        default: true

      ADD_CUSTOM_FEATURES:
        description: "Add Samsung Custom Features"
        required: true
        type: boolean
        default: true

      PATCH_FLAG_SECURE:
        description: "Bypass screenshot and screen record detection"
        required: true
        type: boolean
        default: true

      PATCH_SECURE_FOLDER:
        description: "Patch Samsung Secure Folder"
        required: true
        type: boolean
        default: true

      PATCH_BLUETOOTH_LIBRARY:
        description: "Patch Bluetooth library"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.ROM_NAME }} V${{ inputs.ROM_VERSION }} for ${{ inputs.STOCK_DEVICE }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          echo "FIRM_DIR=$(pwd)/FW" | tee -a "$GITHUB_ENV"
          echo "OUT_DIR=$(pwd)/OUT" | tee -a "$GITHUB_ENV"
          echo "WORK_DIR=$(pwd)/WORK" | tee -a "$GITHUB_ENV"
          echo "DEVICES_DIR=$(pwd)/QuantumROM/Devices" | tee -a "$GITHUB_ENV"
          echo "APKTOOL=$(pwd)/bin/java/apktool.jar" | tee -a "$GITHUB_ENV"
          echo "VNDKS_COLLECTION=$(pwd)/QuantumROM/vndks" | tee -a "$GITHUB_ENV"

          echo "ROM_NAME=${{ inputs.ROM_NAME }}" | tee -a "$GITHUB_ENV"
          echo "ROM_VERSION=${{ inputs.ROM_VERSION }}" | tee -a "$GITHUB_ENV"
          echo "STOCK_DEVICE=${{ inputs.STOCK_DEVICE }}" | tee -a "$GITHUB_ENV"
          echo "TARGET_DEVICE=${{ inputs.TARGET_DEVICE }}" | tee -a "$GITHUB_ENV"
          echo "TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK=${{ inputs.TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK }}" | tee -a "$GITHUB_ENV"
          echo "TARGET_FW_VERSION=${{ inputs.TARGET_FW_VERSION }}" | tee -a "$GITHUB_ENV"

          echo "BUILD_DSU_SINGLE_IMG=${{ inputs.BUILD_DSU_SINGLE_IMG }}" | tee -a "$GITHUB_ENV"
          echo "DEBLOAT_ROM=${{ inputs.DEBLOAT_ROM }}" | tee -a "$GITHUB_ENV"
          echo "USE_UI_8_TETHERING_APEX=${{ inputs.USE_UI_8_TETHERING_APEX }}" | tee -a "$GITHUB_ENV"
          echo "ADD_CHINA_SMART_MANAGER=${{ inputs.ADD_CHINA_SMART_MANAGER }}" | tee -a "$GITHUB_ENV"
          echo "ADD_SAMSUNG_FLAGSHIP_APPS=${{ inputs.ADD_SAMSUNG_FLAGSHIP_APPS }}" | tee -a "$GITHUB_ENV"
          echo "ADD_CUSTOM_FEATURES=${{ inputs.ADD_CUSTOM_FEATURES }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_FLAG_SECURE=${{ inputs.PATCH_FLAG_SECURE }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_SECURE_FOLDER=${{ inputs.PATCH_SECURE_FOLDER }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_BLUETOOTH_LIBRARY=${{ inputs.PATCH_BLUETOOTH_LIBRARY }}" | tee -a "$GITHUB_ENV"

          echo "OUTPUT_FILESYSTEM=${{ inputs.OUTPUT_FILESYSTEM }}" | tee -a "$GITHUB_ENV"
          echo "COMPRESS_IMG_TO_XZ=${{ inputs.COMPRESS_IMG_TO_XZ }}" | tee -a "$GITHUB_ENV"

      - name: Validate STOCK_DEVICE - ${{ inputs.STOCK_DEVICE }}
        run: |
          REPO="zinerom48-tech/QuantumROM"
          BRANCH="Devices"
          LOCAL_DEV_DIR="$(pwd)/QuantumROM/Devices/${{ inputs.STOCK_DEVICE }}"

          source "$(pwd)/scripts/git_utils.sh"

          if [ "${{ inputs.STOCK_DEVICE }}" != "None" ]; then
              if [ -d "$LOCAL_DEV_DIR" ] && [ -f "$LOCAL_DEV_DIR/config" ]; then
                  echo "✅ Found device '${{ inputs.STOCK_DEVICE }}' in local repository!"
              else
                  echo "⚠️ Device '${{ inputs.STOCK_DEVICE }}' not found locally. Checking remote source repository ($REPO)..."
                  
                  if ! curl -fsSL -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$REPO/contents/${{ inputs.STOCK_DEVICE }}?ref=$BRANCH" >/dev/null; then

                    echo "❌ Unsupported: Device '${{ inputs.STOCK_DEVICE }}' not found in local repo nor in $REPO/$BRANCH"
                    exit 1
                  fi

                  echo "✅ Device supported in remote repository: ${{ inputs.STOCK_DEVICE }}. Downloading..."
                  GIT_SPARSE_DOWNLOAD "$REPO" "$BRANCH" "${{ inputs.STOCK_DEVICE }}" "$LOCAL_DEV_DIR"
              fi
          else
              echo "ℹ️ STOCK_DEVICE is set to None."
          fi

      - name: Check disk space
        id: disk
        run: |
          FREE_GB=$(df -BG "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free space: ${FREE_GB} GB"
          echo "enough=$([ "$FREE_GB" -ge 50 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Remove unnecessary files
        if: steps.disk.outputs.enough == 'false'
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils \
              f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-21-jdk jq perl xxd kmod erofs-utils curl wget
          sudo modprobe f2fs || true
          git clone https://github.com/SN-Abdullah-Al-Noman/GoFileDownloader.git
          cd GoFileDownloader
          pip install -r requirements.txt
          mkdir -p FW WORK OUT

      - name: Setup Loop Devices
        run: |
          sudo modprobe loop || true
          for i in {0..15}; do
            sudo mknod -m 0660 /dev/loop$i b 7 $i 2>/dev/null || true
          done

      - name: Download firmware ▶️ ${{ inputs.TARGET_DEVICE }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          DOWNLOAD_FIRMWARE "$TARGET_DEVICE" "$TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK" "$FIRM_DIR" "$TARGET_FW_VERSION"

      - name: Extract firmware
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          EXTRACT_FIRMWARE "$FIRM_DIR/$TARGET_DEVICE"

      - name: Install ZineROM Info system app
        run: |
          set -euo pipefail
          APP_SRC="$(pwd)/QuantumROM/Mods/Apps/ZineROM-Info/system/system/app/ZineROM-Info/ZineROM-Info.apk"
          APP_DST="$FIRM_DIR/$TARGET_DEVICE/system/system/app/ZineROM-Info/ZineROM-Info.apk"
          test -s "$APP_SRC"
          mkdir -p "$(dirname "$APP_DST")"
          cp -f "$APP_SRC" "$APP_DST"
          chmod 0644 "$APP_DST"
          sha256sum "$APP_SRC" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Installed ZineROM Info (com.zinerom.info) into /system/app/ZineROM-Info."

      - name: Extract super.img
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          EXTRACT_SUPER_IMG "$FIRM_DIR/$TARGET_DEVICE"

      - name: Extract firmware img
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          EXTRACT_FIRMWARE_IMG "$FIRM_DIR/$TARGET_DEVICE" "all"

      - name: Decode odm, omc
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          DECODE_OMC "$FIRM_DIR/$TARGET_DEVICE" "$OUT_DIR"

      - name: Debloat Rom - ${{ inputs.DEBLOAT_ROM }}
        run: |
          source "$(pwd)/scripts/debloat.sh"
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$DEBLOAT_ROM" = "true" ] || [ "$DEBLOAT_ROM" = "True" ]; then
              DEBLOAT "$FIRM_DIR/$TARGET_DEVICE"
          fi

      - name: Apply stock device configuration
        run: |
          source "$(pwd)/scripts/debloat.sh"
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$STOCK_DEVICE" != "None" ]; then
              APPLY_STOCK_CONFIG "$STOCK_DEVICE" "$FIRM_DIR/$TARGET_DEVICE"
              DECOMPILE "$APKTOOL" "$FIRM_DIR/$TARGET_DEVICE/system/system/framework" "$FIRM_DIR/$TARGET_DEVICE/system/system/framework/ssrm.jar" "$WORK_DIR"
              PATCH_SSRM "$WORK_DIR/ssrm"
              RECOMPILE "$APKTOOL" "$FIRM_DIR/$TARGET_DEVICE/system/system/framework" "$WORK_DIR/ssrm" "$WORK_DIR"
              mv -f "$WORK_DIR/ssrm.jar" "$FIRM_DIR/$TARGET_DEVICE/system/system/framework/"
          fi

      - name: Add china smart manager - ${{ inputs.ADD_CHINA_SMART_MANAGER }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$ADD_CHINA_SMART_MANAGER" = "true" ] || [ "$ADD_CHINA_SMART_MANAGER" = "True" ]; then
              ADD_CHINA_SMART_MANAGER "$FIRM_DIR/$TARGET_DEVICE"
          fi

      - name: Add samsung flagship apps - ${{ inputs.ADD_SAMSUNG_FLAGSHIP_APPS }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$ADD_SAMSUNG_FLAGSHIP_APPS" = "true" ] || [ "$ADD_SAMSUNG_FLAGSHIP_APPS" = "True" ]; then
              ADD_SAMSUNG_FLAGSHIP_APPS "$FIRM_DIR/$TARGET_DEVICE"
          fi

      - name: Add custom features - ${{ inputs.ADD_CUSTOM_FEATURES }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$ADD_CUSTOM_FEATURES" = "true" ] || [ "$ADD_CUSTOM_FEATURES" = "True" ]; then
              APPLY_CUSTOM_FEATURES "$FIRM_DIR/$TARGET_DEVICE"
          fi

      - name: Patch flag secure and secure folder - ${{ inputs.PATCH_FLAG_SECURE }} - ${{ inputs.PATCH_SECURE_FOLDER }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$PATCH_FLAG_SECURE" = "true" ] || [ "$PATCH_FLAG_SECURE" = "True" ] || [ "$PATCH_SECURE_FOLDER" = "true" ] || [ "$PATCH_SECURE_FOLDER" = "True" ]; then
              INSTALL_FRAMEWORK "$APKTOOL" "$FIRM_DIR/$TARGET_DEVICE/system/system/framework/framework-res.apk"
              DECOMPILE "$APKTOOL" "$FIRM_DIR/$TARGET_DEVICE/system/system/framework" "$FIRM_DIR/$TARGET_DEVICE/system/system/framework/services.jar" "$WORK_DIR"
          fi

          if [ "$PATCH_FLAG_SECURE" = "true" ] || [ "$PATCH_FLAG_SECURE" = "True" ]; then
              PATCH_FLAG_SECURE "$FIRM_DIR/$TARGET_DEVICE" "$WORK_DIR/services"
          fi

          if [ "$PATCH_SECURE_FOLDER" = "true" ] || [ "$PATCH_SECURE_FOLDER" = "True" ]; then
              PATCH_SECURE_FOLDER "$FIRM_DIR/$TARGET_DEVICE" "$WORK_DIR/services"
          fi

          if [ -f "$WORK_DIR/services.jar" ]; then
              mv -f "$WORK_DIR/services.jar" "$FIRM_DIR/$TARGET_DEVICE/system/system/framework/"
              echo "✅ services.jar moved to rom."
          fi

      - name: Patch bluetooth library- ${{ inputs.PATCH_BLUETOOTH_LIBRARY }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$PATCH_BLUETOOTH_LIBRARY" = "true" ] || [ "$PATCH_BLUETOOTH_LIBRARY" = "True" ]; then
              PATCH_BT_LIB "$FIRM_DIR/$TARGET_DEVICE" "$WORK_DIR"
          fi

      - name: Apply others features and patch
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          trap 'echo "ERROR: line=${LINENO} file=${BASH_SOURCE[0]} command=${BASH_COMMAND}"; echo "FUNCNAME: ${FUNCNAME[*]}"' ERR
          PS4='+ ${BASH_SOURCE}:${LINENO}: '
          set -x
          PATCH_SELINUX "$FIRM_DIR/$TARGET_DEVICE"
          DISABLE_SECURITY "$FIRM_DIR/$TARGET_DEVICE"
          set +x

      - name: Apply selected ROM build ID and verify A52s device overlay
        run: |
          set -euo pipefail
          source "$(pwd)/scripts/QuantumRom.sh"

          case "$ROM_NAME" in
            ZineROM|KryptonROM|HiroROM) ;;
            *) echo "Unsupported ROM_NAME: $ROM_NAME" >&2; exit 1 ;;
          esac
          if [[ ! "$ROM_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "Invalid ROM_VERSION; use letters, numbers, dot, underscore, or hyphen." >&2
            exit 1
          fi
          PORTED_DEVICE_MODEL="$(GET_PORTED_DEVICE_MODEL "$STOCK_DEVICE")"
          printf 'PORTED_DEVICE_MODEL=%s\n' "$PORTED_DEVICE_MODEL" >> "$GITHUB_ENV"

          SET_ROM_BUILD_ID "$FIRM_DIR/$TARGET_DEVICE"
          echo "Applied on-device build ID: $CUSTOM_BUILD_ID"

          # Legacy camera compatibility overrides; these do not change actual Knox/bootloader state.
          BUILD_PROP "$FIRM_DIR/$TARGET_DEVICE" system ro.boot.flash.locked 1
          BUILD_PROP "$FIRM_DIR/$TARGET_DEVICE" system ro.boot.verifiedbootstate green
          grep -Fqx 'ro.boot.flash.locked=1' "$FIRM_DIR/$TARGET_DEVICE/system/system/build.prop"
          grep -Fqx 'ro.boot.verifiedbootstate=green' "$FIRM_DIR/$TARGET_DEVICE/system/system/build.prop"
          echo "Verified camera compatibility properties in system build.prop."

          ANDROID_VERSION="$(GET_PROP "$FIRM_DIR/$TARGET_DEVICE" system ro.system.build.version.release)"
          if [ -z "$ANDROID_VERSION" ]; then
            ANDROID_VERSION="$(GET_PROP "$FIRM_DIR/$TARGET_DEVICE" system ro.build.version.release)"
          fi
          ONE_UI_VERSION="$(GET_PROP "$FIRM_DIR/$TARGET_DEVICE" system ro.build.version.oneui)"
          CPU_ABILIST="$(GET_PROP "$FIRM_DIR/$TARGET_DEVICE" system ro.system.product.cpu.abilist)"
          if [ -z "$CPU_ABILIST" ]; then
            CPU_ABILIST="$(GET_PROP "$FIRM_DIR/$TARGET_DEVICE" product ro.product.cpu.abilist)"
          fi
          {
            printf 'ANDROID_VERSION=%s\n' "${ANDROID_VERSION:-Unknown}"
            printf 'ONE_UI_VERSION=%s\n' "${ONE_UI_VERSION:-Unknown}"
            printf 'CPU_ABILIST=%s\n' "${CPU_ABILIST:-Unknown}"
          } >> "$GITHUB_ENV"

          if [ "$STOCK_DEVICE" = "A52s5G" ]; then
            STOCK_PROFILE="$DEVICES_DIR/A52s5G/Stock/system/system/cameradata"
            BUILT_CAMERA="$FIRM_DIR/$TARGET_DEVICE/system/system/cameradata"
            for camera_file in camera-feature.xml aremoji-feature.xml; do
              if ! cmp -s "$STOCK_PROFILE/$camera_file" "$BUILT_CAMERA/$camera_file"; then
                echo "A52s5G camera profile was not applied: $camera_file differs or is missing." >&2
                exit 1
              fi
            done
            echo "Verified A52s5G camera profile files are present in the image input."
          fi

          {
            printf '## Build selection\n\n'
            printf -- '- ROM: `%s`\n' "$ROM_NAME"
            printf -- '- ROM version: `%s`\n' "$ROM_VERSION"
            printf -- '- On-device build ID: `%s`\n' "$CUSTOM_BUILD_ID"
            printf -- '- Ported device model: `%s`\n' "$PORTED_DEVICE_MODEL"
            printf -- '- Target profile: `%s`\n' "$STOCK_DEVICE"
            printf -- '- Base firmware device: `%s`\n' "$TARGET_DEVICE"
            printf -- '- Android version: `%s`\n' "${ANDROID_VERSION:-Unknown}"
            printf -- '- One UI version: `%s`\n' "${ONE_UI_VERSION:-Unknown}"
            printf -- '- CPU ABI list: `%s`\n' "${CPU_ABILIST:-Unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build img - ${{ inputs.OUTPUT_FILESYSTEM }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          BUILD_IMG "$FIRM_DIR/$TARGET_DEVICE" "all" "$OUTPUT_FILESYSTEM" "$OUT_DIR"

      - name: Compress all .img & make zip file before upload - ${{ inputs.COMPRESS_IMG_TO_XZ }}
        run: |
          echo "BUILD_TIME=$(TZ='Egypt' date '+%Y-%m-%d %I:%M:%S %p')" | tee -a "$GITHUB_ENV"
          ZIP_NAME="${ROM_NAME}_${PORTED_DEVICE_MODEL}_V${ROM_VERSION}.zip"
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"

          if [ "$COMPRESS_IMG_TO_XZ" = "true" ] || [ "$COMPRESS_IMG_TO_XZ" = "True" ]; then
              echo "Compressing all .img files to .xz (level 9)..."
              for img in "$OUT_DIR"/*.img; do
                  [ -f "$img" ] || continue
                  echo "Compressing $img"
                  xz -9 -T0 "$img"
              done
          fi

          echo "Creating zip: $ZIP_NAME"
          7z a -tzip "$ZIP_PATH" "$OUT_DIR"/* -mx=5
          echo "ZIP_PATH=$ZIP_PATH" | tee -a "$GITHUB_ENV"

      - name: Upload file in GoFile & Create Release
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          bash release.sh
